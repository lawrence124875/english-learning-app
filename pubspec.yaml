name: english_learning_app
description: "智慧聽覺巡航 - 四合一英語核心學習神器"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  audio_service: ^0.18.15
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  cloud_firestore: ^5.4.4
  package_info_plus: ^8.0.2
  firebase_storage: ^12.3.4
  path_provider: ^2.1.4
  purchases_flutter: ^8.4.0
  google_mobile_ads: ^9.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  android_intent_plus: ^5.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/manifest.json
    - assets/data/ngsl_2809.json
    - assets/data/ngsl_spoken_720.json
    - assets/data/phrase_list_506.json
    - assets/data/phave_list_150.json
