name: Build Personal iOS IPA (manual only)

# Lawrence 自用的 iOS 全解鎖版（FORCE_PREMIUM、無廣告、無訂閱）。
# 產出「未簽署」IPA，由 Lawrence 在 Mac 上用 Sideloadly / AltStore
# 以免費 Apple ID 簽署安裝（每 7 天需續簽）。只手動觸發。
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create iOS platform scaffold
        run: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios --project-name=english_learning_app --org tw.bcc .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate iOS config (Podfile)
        run: flutter build ios --config-only --release --no-codesign || true

      - name: Patch iOS project
        env:
          FIREBASE_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST }}
        run: bash scripts/patch_ios.sh

      - name: Build iOS (personal, all-unlocked, unsigned)
        run: |
          set +e
          flutter build ios --release --no-codesign \
            --dart-define=FORCE_PREMIUM=true \
            2>&1 | tee /tmp/build_ios.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "\.dart:[0-9]+|Error:|error:|FAILURE|What went wrong|Swift Compiler Error|pod install" /tmp/build_ios.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Package IPA
        run: |
          rm -rf Payload english-learning-app-personal.ipa
          mkdir -p Payload
          # ditto 會把符號連結複製成實體檔（IPA 內不能有符號連結）
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          xattr -cr Payload
          find Payload -name '.DS_Store' -delete
          # 檢查：符號連結、主程式、Info.plist
          links=$(find Payload -type l | head -20)
          if [ -n "$links" ]; then echo "$links" | while read -r l; do echo "::warning::symlink $l"; done; fi
          exe=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" Payload/Runner.app/Info.plist)
          test -f "Payload/Runner.app/$exe" || { echo "::error::找不到主程式 $exe"; exit 1; }
          lipo -info "Payload/Runner.app/$exe" | sed 's/^/::notice::/'
          echo "::notice::MinimumOSVersion $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' Payload/Runner.app/Info.plist) bundle $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Runner.app/Info.plist)"
          ls Payload/Runner.app/Frameworks | tr '\n' ' ' | sed 's/^/::notice::Frameworks: /'; echo
          # 用不含符號連結、不含 macOS 額外屬性的標準 zip 打包
          zip -qr -X english-learning-app-personal.ipa Payload
          unzip -tq english-learning-app-personal.ipa
          ls -lh english-learning-app-personal.ipa

      # 2026-10-01：不上傳公開 Artifacts，改發佈到私人 repo english-app-builds 的 Release。
      - name: Publish IPA to private repo release
        env:
          GH_TOKEN: ${{ secrets.BUILDS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          ver=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          f="personal-ios_${ver}_run${{ github.run_number }}.ipa"
          cp english-learning-app-personal.ipa "$f"
          gh release create "ios-personal-run${{ github.run_number }}" "$f" \
            --repo lawrence124875/english-app-builds \
            --title "iOS 個人全解鎖版 ${ver}（run ${{ github.run_number }}）" \
            --notes "commit ${{ github.sha }}；僅供本人安裝（Impactor 側載）。"
