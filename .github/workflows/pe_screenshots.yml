name: PE store screenshots (work branch only)

# 只在工作分支產生實用英文商店截圖，不建置、不簽署、不發布。
on:
  push:
    branches: [claude/project-thread-h8lsg0]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.7'
          cache: true
      - name: Fonts
        run: |
          mkdir -p /tmp/fonts && cd /tmp/fonts
          for c in TC SC JP KR; do for w in Regular Medium Bold; do
            curl -fsSLo NotoSans$c-$w.otf -w "%{http_code} $c-$w\n" https://github.com/notofonts/noto-cjk/raw/main/Sans/SubsetOTF/$c/NotoSans$c-$w.otf
          done; done
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core >/dev/null
          N=/usr/share/fonts/truetype/noto
          for s in Thai Arabic; do for w in Regular Medium Bold; do
            f=$N/NotoSans$s-$w.ttf; [ -f $f ] || f=$N/NotoSans$s-Regular.ttf
            cp $f NotoSans$s-$w.ttf
          done; done
          ls -la
      - run: flutter pub get
      - name: Render
        run: flutter test tool/store_screenshots/pe_screenshot_test.dart --dart-define=FLUTTER_ROOT=$FLUTTER_ROOT --dart-define=FONT_DIR=/tmp/fonts
      - name: Compose
        run: |
          pip install pillow
          python3 tool/store_screenshots/compose.py
      - name: Push images to temp branch (copied to private repo, then deleted)
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan pe-shots-tmp
          git rm -rq --cached .
          git add -f store_assets/localized/*/6_practical.png
          git commit -qm "PE screenshots (temp)"
          git push -f origin pe-shots-tmp
