name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 這個專案目前只包含 lib/ 和 pubspec.yaml（跨平台的部分）。
      # android/ 平台資料夾是在這裡自動產生，避免手動維護容易出錯的原生設定檔。
      - name: Ensure Android platform scaffold exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name=english_learning_app --org tw.bcc .
          fi


      - name: Patch AndroidManifest for background audio playback
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: bash scripts/patch_android_manifest.sh

      - name: Patch MainActivity for audio_service compatibility
        run: bash scripts/patch_main_activity.sh

      - name: Patch compileSdk for plugin compatibility
        run: bash scripts/patch_compile_sdk.sh

      - name: Configure Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        run: bash scripts/patch_firebase.sh

      - name: Patch ProGuard rules for Firebase (R8 compatibility)
        run: bash scripts/patch_firebase_proguard.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Patch file_picker compileSdk (plugin compatibility)
        run: bash scripts/patch_file_picker_sdk.sh

      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/patch_signing_config.sh

      - name: Build APK (release)
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          flutter build apk --release \
            --dart-define=REVENUECAT_API_KEY=$REVENUECAT_API_KEY \
            --dart-define=ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED_AD_UNIT_ID \
            --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=$ADMOB_INTERSTITIAL_AD_UNIT_ID \
            --dart-define=ADMOB_BANNER_AD_UNIT_ID=$ADMOB_BANNER_AD_UNIT_ID

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-learning-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build AAB (release, for Play Console upload)
        env:
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.ADMOB_REWARDED_AD_UNIT_ID }}
          ADMOB_INTERSTITIAL_AD_UNIT_ID: ${{ secrets.ADMOB_INTERSTITIAL_AD_UNIT_ID }}
          ADMOB_BANNER_AD_UNIT_ID: ${{ secrets.ADMOB_BANNER_AD_UNIT_ID }}
        run: |
          flutter build appbundle --release \
            --dart-define=REVENUECAT_API_KEY=$REVENUECAT_API_KEY \
            --dart-define=ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED_AD_UNIT_ID \
            --dart-define=ADMOB_INTERSTITIAL_AD_UNIT_ID=$ADMOB_INTERSTITIAL_AD_UNIT_ID \
            --dart-define=ADMOB_BANNER_AD_UNIT_ID=$ADMOB_BANNER_AD_UNIT_ID

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-learning-app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
