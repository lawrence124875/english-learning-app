name: Fetch LC Lab icons (one-off)

# 一次性：從 Play 商店頁取兩個 App 的圖示，存進 assets/lclab/ 並推回此工作分支。
# 完成後會刪除此 workflow，不併入 main。
on:
  push:
    branches: [claude/project-thread-kcadhl]
    paths: ['.github/workflows/fetch_lclab_icons.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download icons
        run: |
          set -e
          mkdir -p assets/lclab
          for pair in qiangua:com.lclab.qiangua tarot:com.lclab.tarot; do
            name=${pair%%:*}; id=${pair#*:}
            html=$(curl -sSL -A "Mozilla/5.0" "https://play.google.com/store/apps/details?id=$id&hl=en")
            url=$(echo "$html" | grep -oE '<meta property="og:image" content="[^"]+"' | head -1 | sed -E 's/.*content="([^"]+)"/\1/')
            echo "$name -> $url"
            test -n "$url"
            curl -sSL "${url%%=*}=w192-h192" -o "assets/lclab/$name.png"
            file "assets/lclab/$name.png"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/lclab
          git commit -m "Add LC Lab app icons (fetched from Play) [skip ci]"
          git push
